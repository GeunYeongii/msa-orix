<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orix Capital Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: #003366;
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 50px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .portal-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1000px;
            width: 90%;
        }

        .service-card {
            background: white;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-top: 5px solid #ccc;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .service-card.lease { border-top-color: #007bff; }
        .service-card.loan { border-top-color: #28a745; }
        .service-card.exchange { border-top-color: #6f42c1; }

        .service-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .service-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .service-desc {
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>
    <header>
        <h1>Orix Capital MSA Portal</h1>
    </header>

    <div class="portal-container">
        <!-- Lease Service Link -->
        <a href="/lease/" class="service-card lease">
            <div class="service-icon">🚗</div>
            <div class="service-title">리스 현황</div>
            <div class="service-desc">장기렌터카 및 오토리스 관리</div>
        </a>

        <!-- Loan Service Link -->
        <a href="/loan/" class="service-card loan">
            <div class="service-icon">💰</div>
            <div class="service-title">대출 현황</div>
            <div class="service-desc">신용대출 및 담보대출 현황</div>
        </a>

        <!-- Exchange Service Link -->
        <a href="/exchange/" class="service-card exchange">
            <div class="service-icon">💱</div>
            <div class="service-title">환율 정보</div>
            <div class="service-desc">실시간 환율 및 금융 동향</div>
        </a>
    </div>
</body>

</html>
