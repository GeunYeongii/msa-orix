<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orix Capital Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">Orix Capital Dashboard</div>
        <div class="user-profile">
            <div class="avatar"></div>
            <span>주근영 고객님</span>
        </div>
    </header>

    <main class="dashboard">
        <!-- Lease Service Widget -->
        <section class="widget" id="lease-widget">
            <div class="widget-header">
                <h2>내 리스 현황</h2>
                <div class="status-indicator"></div>
            </div>
            <div class="widget-content" id="lease-content">
                <div class="loader"></div>
            </div>
        </section>

        <!-- Loan Service Widget -->
        <section class="widget" id="loan-widget">
            <div class="widget-header">
                <h2>내 대출 현황</h2>
                <div class="status-indicator"></div>
            </div>
            <div class="widget-content" id="loan-content">
                <div class="loader"></div>
            </div>
        </section>

        <!-- Exchange Service Widget -->
        <section class="widget" id="exchange-widget">
            <div class="widget-header">
                <h2>실시간 환율</h2>
                <div class="status-indicator"></div>
            </div>
            <div class="widget-content" id="exchange-content">
                <div class="loader"></div>
            </div>
        </section>
    </main>

    <script>
        // API 엔드포인트
        const ENDPOINTS = {
            lease: '/api/lease/',
            loan: '/api/loan/',
            exchange: '/api/exchange/'
        };

        // 데이터 렌더링 함수들
        function renderLease(data) {
            return data.map(item => `
                <div class="data-row">
                    <div class="row-left">
                        <strong>${item.leaseName}</strong>
                        <span class="sub-text">${item.contractNo}</span>
                    </div>
                    <div class="row-right amount">${item.monthlyFee} 원/월</div>
                </div>
            `).join('');
        }

        function renderLoan(data) {
            return data.map(item => `
                <div class="data-row">
                    <div class="row-left">
                        <strong>${item.productName}</strong>
                        <span class="sub-text">한도: ${item.limit}</span>
                    </div>
                    <div class="row-right rate">${item.interestRate}</div>
                </div>
            `).join('');
        }

        function renderExchange(data) {
            return data.map(item => {
                const isUp = item.change.startsWith('+');
                const changeClass = isUp ? 'up' : 'down';
                return `
                <div class="data-row">
                    <div class="row-left">
                        <strong>${item.currency}</strong>
                    </div>
                    <div class="row-right">
                        <span class="rate">${item.rate}</span>
                        <span class="change ${changeClass}">${item.change}</span>
                    </div>
                </div>
            `}).join('');
        }

        // 공통 Fetch 함수
        async function fetchService(serviceName, renderFunc) {
            const widget = document.getElementById(`${serviceName}-widget`);
            const content = document.getElementById(`${serviceName}-content`);
            const indicator = widget.querySelector('.status-indicator');

            try {
                // 캐시 방지를 위해 타임스탬프 추가
                const response = await fetch(`${ENDPOINTS[serviceName]}?t=${new Date().getTime()}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const json = await response.json();

                // 성공 상태
                widget.classList.remove('error');
                indicator.classList.remove('error');
                indicator.classList.add('success');
                indicator.title = '서비스 정상 동작중';

                content.innerHTML = renderFunc(json.data);

            } catch (error) {
                console.error(`${serviceName} fetch error:`, error);

                // 에러 상태 (장애 격리 시연용)
                widget.classList.add('error');
                indicator.classList.remove('success');
                indicator.classList.add('error');
                indicator.title = '서비스 장애 발생';

                content.innerHTML = `
                    <div class="error-state">
                        <div class="error-icon">⚠️</div>
                        <h3>서비스 점검중</h3>
                        <p>현재 <b>${serviceName.toUpperCase()}</b> 서비스 서버가 응답하지 않습니다.<br>나머지 서비스는 정상적으로 이용 가능합니다.</p>
                        <button onclick="fetchService('${serviceName}', ${renderFunc.name})">다시 시도</button>
                    </div>
                `;
            }
        }

        // 초기 로딩
        document.addEventListener('DOMContentLoaded', () => {
            fetchService('lease', renderLease);
            fetchService('loan', renderLoan);
            fetchService('exchange', renderExchange);
            
            // 주기적 업데이트 (10초마다 자동 갱신 - 서비스 죽인 후 시연을 위해)
            setInterval(() => {
                fetchService('lease', renderLease);
                fetchService('loan', renderLoan);
                fetchService('exchange', renderExchange);
            }, 5000);
        });
    </script>
</body>

</html>
