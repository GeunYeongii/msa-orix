server {
    listen 80;
    server_name localhost;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy API requests to API Gateway
    location /lease/ {
        proxy_pass http://api-gw:80/lease/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /loan/ {
        proxy_pass http://api-gw:80/loan/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /exchange/ {
        proxy_pass http://api-gw:80/exchange/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
