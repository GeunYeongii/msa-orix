server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=5s;

    # Store / Menu Service
    location /api/store/ {
        set $upstream_store http://baemin-store:8081;
        rewrite ^/api/store/(.*) /$1 break;
        proxy_pass $upstream_store;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Order Service
    location /api/order/ {
        set $upstream_order http://baemin-order:8082;
        rewrite ^/api/order/(.*) /$1 break;
        proxy_pass $upstream_order;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Payment Service
    location /api/payment/ {
        set $upstream_payment http://baemin-payment:8083;
        rewrite ^/api/payment/(.*) /$1 break;
        proxy_pass $upstream_payment;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Delivery & Rider Service
    location /api/delivery/ {
        set $upstream_delivery http://baemin-delivery:8084;
        rewrite ^/api/delivery/(.*) /$1 break;
        proxy_pass $upstream_delivery;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Review & Rating Service
    location /api/review/ {
        set $upstream_review http://baemin-review:8085;
        rewrite ^/api/review/(.*) /$1 break;
        proxy_pass $upstream_review;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Notification Service
    location /api/notification/ {
        set $upstream_notification http://baemin-notification:8086;
        rewrite ^/api/notification/(.*) /$1 break;
        proxy_pass $upstream_notification;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
