server {
    listen 80;
    server_name localhost;

    # Lease Service Routing
    location /api/lease/ {
        proxy_pass http://lease:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Loan Service Routing
    location /api/loan/ {
        proxy_pass http://loan:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Exchange Rate Service Routing
    location /api/exchange/ {
        proxy_pass http://exchange:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Frontend Routing
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
